# On every v1.2.3 tag: tests, a signed release APK, checked and published as a GitHub release.
# The site (ping-up.org) picks up the latest APK from here within minutes, no other step.
# Keep the asset name ping-up.apk: the site links to releases/latest/download/ping-up.apk.
#
# Required secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    base64 -i release.jks
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew test

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK
        env:
          PINGUP_KEYSTORE: ${{ runner.temp }}/release.jks
          PINGUP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PINGUP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PINGUP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - name: Check
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" > certs.txt
          if "$tools/aapt2" dump badging "$apk" | grep -q debuggable; then
            echo "the APK is debuggable" && exit 1
          fi
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='${GITHUB_REF_NAME#v}'"
          cp "$apk" ping-up.apk
          {
            echo "SHA-256: \`$(sha256sum ping-up.apk | cut -d' ' -f1)\`"
            echo
            echo "Certificate (SHA-256): \`$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')\`"
          } > notes.md
          cat notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ping-up.apk --title "$GITHUB_REF_NAME" --notes-file notes.md
