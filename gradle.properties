# The app name lives only here: @string/app_name and the project name are generated from it.
appName=Ping Up

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# :core's iOS source set shares the libsodium cinterop between the device and the simulator target
kotlin.mpp.enableCInteropCommonization=true
# the iOS targets can't be built off macOS (CI runs on Linux); they're skipped there without a warning
kotlin.native.ignoreDisabledTargets=true
